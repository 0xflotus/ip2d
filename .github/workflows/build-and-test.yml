name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "**.js"
      - ".github/workflows/*.yml"
      - "package.json"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: 26
          cache: true
      - run: |
          npm ci
          npm run format -- --check
      - name: Lint with Oxlint
        run: npx oxlint *.{js,mjs}
      - name: Lint with ESLint
        run: npm run eslint
  build:
    name: Testing
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        version: [22, 23, 24, 25, 26, latest]
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-24.04-arm,
            ubuntu-26.04-arm,
            macos-15-intel,
            macos-26-intel,
            macos-14,
            macos-15,
            macos-26,
            macos-latest,
          ]
        include:
          - os: ubuntu-latest
            node-version: 21
          - os: macos-latest
            node-version: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: |
          npm ci
          npm run test
