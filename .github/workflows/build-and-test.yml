name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm clean-install
      - name: Run npm format
        run: npm run format -- --check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: 26
          cache: true
      - run: |
          npm clean-install
          npm run format -- --check
      - name: Lint with Oxlint
        run: npx oxlint *.{js,mjs}
      - name: Lint with ESLint
        run: npm run eslint
  build:
    name: Testing
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 23, 24, 25, 26, current, lts/*, latest]
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-22.04-arm,
            ubuntu-24.04-arm,
            ubuntu-26.04-arm,
            macos-15-intel,
            macos-26-intel,
            macos-15,
            macos-26,
            macos-latest,
            xcode-27,
            windows-2022,
            windows-2025,
            windows-latest,
          ]
        include:
          - os: ubuntu-latest
            node-version: 21
          - os: macos-latest
            node-version: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: |
          npm clean-install
          npm run build
          npm run test
