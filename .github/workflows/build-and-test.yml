name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - "**.js"
      - ".github/workflows/*.yml"
      - "package.json"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: 26
          cache: "npm"
      - run: |
          npm ci
          npm run format -- --check
      - name: Lint with Oxlint
        run: npx oxlint *.{js,mjs}
      - name: Lint with ESLint
        run: npm run eslint
  build:
    name: Testing
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 26
          - os: ubuntu-24.04-arm
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: |
          npm ci
          npm run test
