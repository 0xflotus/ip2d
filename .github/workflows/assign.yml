name: Assign PR and Reviewer

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR and Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-assignee 0xflotus
          if [ "$PR_AUTHOR" != "0xflotus" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$REPO" \
              --add-reviewer 0xflotus
          fi
